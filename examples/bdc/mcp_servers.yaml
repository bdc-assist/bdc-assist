# The BDC bot's servers: the doc search server plus the Dug knowledge-graph tools and the Artie
# publication search.
# Loaded instead of config/mcp_servers.yaml when CONFIG_DIR=examples/bdc.

r_doc_mcp:
  transport: streamable_http
  url: http://127.0.0.1:8001/mcp
  stand_ins: [search_docs]  # while doc-mcp is down, say so instead of answering without the docs
  keep_session: true  # r-doc-mcp is stateless: one session kept open, not one per call
  prompt: |
    - search_docs searches the BDC documentation (guides, website pages, FAQs, videos, news,
      events). Use it for what BDC is, how to use it, policies, tools, and events, and cite
      the sources you used. Use the term 'documentation' instead of context in your responses.
      For exact names, acronyms, or tool names the embedding search may blur, retry with
      mode="keyword" (fuzzy literal matching: "picsure" finds "PIC-SURE").
      Search results are ranked by relevance, NOT date. For questions about recent or latest
      events/news you MUST pass date_from (start about a year back and widen the range if
      nothing returns), then pick the newest date among the results; for upcoming/future
      events set date_from to today and leave date_to unset.

# Dug knowledge-graph tools (github.com/bdc-assist/dug-mcp)
dug_mcp:
  transport: sse
  url: https://dug-mcp.apps.renci.org/sse
  interceptors: [dug_kg]  # functions in interceptors.py, run on this server's tool calls only
  # the tools its prompt names: while dug is down (e.g. off the RENCI VPN) each answers with an
  # error, so a study/variable question gets "service unavailable" instead of doc-search guesses
  stand_ins: [search_concepts, find_cohort_variables, get_concept_graph, get_concept_connections,
              find_variables, search_variables_by_name]
  prompt: |
    - The knowledge-graph tools (search_concepts, find_variables, find_cohort_variables,
      get_concept_graph, search_variables_by_name, and the rest) search the BDC data catalog:
      studies (phs IDs), study variables (phv IDs), biomedical concepts, and PIC-SURE paths.
      Use them for which studies or variables cover a disease, phenotype, measurement, or
      cohort. They expand synonyms for you ("heart attack" also finds "myocardial infarction").
      - Studies on one concept (e.g. "list studies on heart attack"): search_concepts with
        search_term="heart attack", find_variables=true and limit=10. Its _sources lists every
        study linked to the concept (title, and the phs ID in the link): list them all. Its
        variables don't say which study they belong to; don't look that up. Keep limit at 10:
        larger results arrive truncated and lose _sources.
      - Studies covering several terms at once (a cohort, e.g. asthma AND obesity):
        find_cohort_variables with concepts=["asthma", "obesity"]; feasible_studies lists
        studies that have variables for every term.
      - There is no study-by-name search: a study appears only when one of its variables is
        linked to the concept, so say so if a user asks for a study by title.
      Answer with the study and variable names and IDs the tools returned. Omit any field a
      tool did not return: for example, do not add a Description line for a variable that
      has no description, and never write placeholders such as "not provided".
      If a search returns no studies or variables, retry with other wording before saying
      none were found. If a knowledge-graph tool returns an error, say that the study and variable
      search service is currently unavailable and suggest trying again later. Do not list
      studies or variables from search_docs instead (studies the documentation mentions are
      not catalog results), and do not guess.

# BDC publication search (artie-mcp over github.com/bdc-assist/artie-api; dev, RENCI VPN)
artie_mcp:
  transport: streamable_http
  url: http://127.0.0.1:8002/mcp
  keep_session: true  # artie-mcp is stateless
  stand_ins: [search_publications]  # while it's down, say so instead of naming papers from memory
  prompt: |
    - search_publications searches a small, curated set of published papers that used BDC
      (title, link, year, journal, research area, cohort/dataset, how BDC was used, and the
      passages where the paper mentions BDC). Use it when a question asks about papers or
      publications, or about research on a disease, trait, dataset, or method (e.g. "has anyone
      used BDC to study asthma?"). Pass 1-4 key terms as keywords, never the whole question:
      keywords=["asthma", "microbiome"]. Add research_areas only for a broad Heart, Lung, Blood,
      Sleep, or Genomics question.
      List the returned papers that fit the question, with their title and link (it matches any
      keyword anywhere, so skip off-topic ones). If none fit, say no papers in BDC's curated
      publication list matched; do not name papers from memory or from search_docs.
      If it returns an error about its arguments, fix them and call again; for any other
      error, say publication search is currently unavailable.
