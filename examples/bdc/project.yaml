name: NHLBI BioData Catalyst®
short_name: BDC
assistant_name: BDC Assist
followups: 3  # this example's prompts.yaml is verbatim upstream and asks for exactly 3
doc_search_tool: search_docs
sources_key: bdc-doc  # what bdc-assist clients expect
extra_nodes:  # per slot, functions in nodes.py, each with its settings
  after_agent:
    related_work:  # papers on the question's topic, found beside the answer check
      label: Finding related papers…  # what the web client shows while it runs
      tool: search_publications  # the tool it searches (artie-mcp)
      fields: [related]  # the papers it found, {sources key: [{title, link, type}]}: returned with the
                         # answer beside its sources, not among them (the answer isn't based on them)
