# Fills the ${placeholders} in prompts.yaml and predefined_responses.yaml.
name: My Project            # full name, as users see it
short_name: MP              # how the assistant refers to it (use the full name again if there is no short form)
assistant_name: MP Assist   # the bot's own name
followups: 3                # how many follow-up questions the bot suggests after an answer; 0 = none
append_disclaimer: true     # add the flag-a predefined responses after the answer; false = leave them to a node of yours
doc_search_tool: search_docs  # MCP tool whose results are listed as sources under an answer
sources_key: r-doc            # key of that list in the API's "sources" field
# extra_nodes:     # optional: steps of your own, functions in nodes.py next to this file (see examples/bdc)
#   before_agent:     # in order, between the input checks and the agent, e.g. rewriting the question;
#                     # one that returns an answer ends the chat with it (no agent, check or follow-ups)
#     detect_language:              # a function in nodes.py, then its settings (all optional):
#       label: Checking your language…  # what a web client shows while it runs
#       fields: [user_lang]         # state fields of its own: later nodes read them, the API returns them
#       min_words: 3                # anything else is the node's own, handed to it
#   after_agent:      # side by side with the answer check and follow-ups, e.g. related_work (examples/bdc);
#                     # several nodes all go under this one key (a key written twice fails at startup);
#                     # each writes only the fields it lists, and no two may list one
#   after_finish:     # in order, on an answer that passed its check, before the disclaimers
# node_timeout:      # optional: seconds one of those nodes may take, per slot (30 each unless set);
#   before_agent: 10  # a slower one is skipped (logged), and the chat goes on without it
#   after_agent: 30
#   after_finish: 10
# builtin_nodes:     # optional: the built-in steps' labels, what a web client shows while one runs
#   main_agent:      # (contextualize, input_guardrail, classify, main_agent, output_guardrail,
#     label: Thinking…  #  suggest_followups, append_disclaimer; the client's own text unless set)
